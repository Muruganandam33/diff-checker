---
- name: Manage Diff Checker configuration
  hosts: local
  gather_facts: false
  vars_files:
    - vars/main.yml

  tasks:
    - name: Create configuration directory
      ansible.builtin.file:
        path: "{{ config_dir }}"
        state: directory
        mode: "0755"

    - name: Create/update app.env from template
      ansible.builtin.template:
        src: app.env.j2
        dest: "{{ config_dir }}/app.env"
        mode: "0644"

    - name: Show the generated file
      ansible.builtin.command: cat "{{ config_dir }}/app.env"
      register: env_file
      changed_when: false

    - name: Print file content
      ansible.builtin.debug:
        var: env_file.stdout_lines
